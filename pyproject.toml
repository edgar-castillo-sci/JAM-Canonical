[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jam-canonical"
version = "1.0.0"
description = "Canonicalization of JAM strings for duplicate detection in layered materials"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Edgar R. H. Castillo", email = "edgar.castillo.sci@gmail.com"},
]
dependencies = [
    "numpy",
]
keywords = ["JAM", "canonicalization", "symmetry", "2D materials", "duplicate detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/edgar-castillo-sci/jam-canonical"
Documentation = "https://github.com/edgar-castillo-sci/jam-canonical#readme"
Source = "https://github.com/edgar-castillo-sci/jam-canonical"

[project.optional-dependencies]
tests = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["jam_canonical*"]
